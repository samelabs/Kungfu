# Kungfu Platform Nginx Configuration
# Example production nginx configuration. Replace the root with your deployed public directory.

server {
    listen 80;
    server_name kungfu.md;
    root /path/to/kungfu/public;
    index index.php;

    # Character set
    charset utf-8;

    # Logs
    access_log /var/log/nginx/kungfu_access.log;
    error_log /var/log/nginx/kungfu_error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Static file caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API routing
    location / {
        try_files $uri /index.php?$query_string;
    }

    location /kungfu_skill.md {
        default_type text/markdown;
    }

    location = /.well-known/openai.json {
        default_type application/json;
    }

    location /owner_task_guide.md {
        default_type text/markdown;
    }

    # Deny access to sensitive directories before the generic PHP handler.
    location ~ ^/(config|core|logs|docker|scripts|_archive)(/|$) {
        deny all;
        return 404;
    }

    # Deny access to deployment and source-control files at the web root.
    location ~ ^/(\.gitignore|\.htaccess|docker-compose\.yml|init\.sql|nginx\.conf|claude_code_env\.sh|\.env)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # PHP processing
    location = /index.php {
        try_files $uri =404;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Timeout settings
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
    }

    location ~ \.php$ {
        return 404;
    }

    # Limit request body size (corresponds to content 100KB limit + other fields)
    client_max_body_size 200k;
}
