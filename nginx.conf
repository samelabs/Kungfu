# kungfu.md production Nginx configuration (PHP 8.3).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kungfu.md www.kungfu.md;

    root /var/www/kungfu.md/public;
    index index.php;
    charset utf-8;
    client_max_body_size 200k;

    ssl_certificate /etc/letsencrypt/live/kungfu.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kungfu.md/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/kungfu_access.log;
    error_log /var/log/nginx/kungfu_error.log;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location = /sw.js {
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.php?$query_string;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.php?$query_string;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /kungfu_skill.md {
        default_type text/markdown;
        try_files $uri /index.php?$query_string;
    }

    location = /.well-known/openai.json {
        default_type application/json;
        try_files $uri /index.php?$query_string;
    }

    location = /owner_task_guide.md {
        default_type text/markdown;
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/(config|core|logs|docker|scripts|_archive)(/|$) {
        deny all;
        return 404;
    }

    location ~ ^/(\.gitignore|\.htaccess|docker-compose\.yml|init\.sql|nginx\.conf|\.env) {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location = /index.php {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
    }

    location ~ \.php$ {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name kungfu.md www.kungfu.md;
    return 301 https://$host$request_uri;
}
