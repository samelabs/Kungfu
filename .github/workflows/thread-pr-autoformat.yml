name: Thread PR Autoformat

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/thread-collaboration-v01' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: gofmt thread files and push
        run: |
          set -euo pipefail
          gofmt -w             internal/mcpserver/thread_tools_test.go             internal/mcpserver/tools_thread.go             internal/repository/thread.go             internal/service/thread.go             internal/service/thread_test.go

          if git diff --quiet; then
            echo "Thread files already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             internal/mcpserver/thread_tools_test.go             internal/mcpserver/tools_thread.go             internal/repository/thread.go             internal/service/thread.go             internal/service/thread_test.go
          git commit -m "style(thread): gofmt collaboration files"
          git push origin HEAD:${{ github.head_ref }}
