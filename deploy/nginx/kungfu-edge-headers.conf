# kungfu.md edge headers. The Go app itself sends X-Frame-Options,
# X-Content-Type-Options, Referrer-Policy and Permissions-Policy on every
# response; repeating them here produced duplicate headers. nginx owns
# only what the app does not set.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
# CSP: 'self' everywhere. 'unsafe-eval' is gone (nothing uses eval) and
# so are the sdk.51.la / unpkg.com third-party allowances (no such
# assets load anywhere in the tree). 'unsafe-inline' remains for now:
# the HTML templates carry inline scripts/onchange handlers; removing
# it is a separate front-end task (nonce or hash every inline script).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
