# kungfu.md edge headers. The Go app itself sends X-Frame-Options,
# X-Content-Type-Options, Referrer-Policy and Permissions-Policy on every
# response; repeating them here produced duplicate headers. nginx owns
# only what the app does not set.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sdk.51.la https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://*.51.la; frame-ancestors 'none'" always;
