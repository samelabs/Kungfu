# kungfu.md production Nginx configuration (Go).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kungfu.md www.kungfu.md;

    # Body size: the Go entrances enforce their own caps (1 MiB for
    # /mcp, /api/v1 and the owner tool bridge; 64 KB for admin forms),
    # so nginx must not reject a legal request first. 1100k covers the
    # largest of them with envelope headroom; the app remains the
    # authority for anything over its own limits.
    client_max_body_size 1100k;

    ssl_certificate /etc/letsencrypt/live/kungfu.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kungfu.md/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/kungfu_access.log;
    error_log /var/log/nginx/kungfu_error.log;

    include /etc/nginx/snippets/kungfu-edge-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location = /sw.js {
        default_type application/javascript;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/kungfu-edge-headers.conf;
        proxy_pass http://127.0.0.1:8090;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        include /etc/nginx/snippets/kungfu-edge-headers.conf;
        proxy_pass http://127.0.0.1:8090;
    }

    # Images/icons only. JS/CSS are NOT cached here: the app serves them
    # with Cache-Control: no-cache so a deploy is picked up immediately.
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/kungfu-edge-headers.conf;
        proxy_pass http://127.0.0.1:8090;
    }

    # MCP endpoint: the official MCP Go SDK enforces DNS-rebinding
    # localhost protection (loopback listener must receive a loopback
    # Host). This reverse-proxy deployment terminates TLS at nginx and
    # forwards to 127.0.0.1:8090, so the upstream Host for this exact
    # route is set to loopback; the external hostname is preserved via
    # X-Forwarded-Host. All other proxy transport settings match the
    # generic location. No other route changes Host behavior.
    location = /mcp {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append): the app takes the client IP for rate
        # limiting from the rightmost-untrusted XFF entry under a trusted
        # direct peer, so a client-supplied value must not survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (never append): the app takes the client IP for rate
        # limiting from the rightmost-untrusted XFF entry under a trusted
        # direct peer, so a client-supplied value must not survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}

# Fixed redirect target: reflecting $host would let an arbitrary Host
# header turn the edge into an open-redirector.
server {
    listen 80;
    listen [::]:80;
    server_name kungfu.md www.kungfu.md;
    return 301 https://kungfu.md$request_uri;
}
