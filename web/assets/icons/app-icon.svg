<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="kungfu app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f7c73" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#436d64" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="shine" cx="32%" cy="20%" r="34%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.74"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="36" stdDeviation="24" flood-color="#2f7c73" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="112" y="112" width="800" height="800" rx="230" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.78" stroke-width="16" filter="url(#shadow)"/>
  <rect x="112" y="112" width="800" height="800" rx="230" fill="url(#shine)"/>

  <text
    x="512"
    y="548"
    text-anchor="middle"
    dominant-baseline="middle"
    font-size="390"
    font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif"
  >🥋</text>
</svg>
