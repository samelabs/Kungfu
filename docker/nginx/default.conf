server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    location = /llms.txt {
        default_type text/plain;
        try_files $uri /index.php?$query_string;
    }

    location = /.well-known/openai.json {
        default_type application/json;
        try_files $uri /index.php?$query_string;
    }

    location = /kungfu_skill.md {
        default_type text/markdown;
        try_files $uri /index.php?$query_string;
    }

    location = /owner_task_guide.md {
        default_type text/markdown;
        try_files $uri /index.php?$query_string;
    }

    # Deny access to sensitive directories
    location ~ ^/(config|core|logs|docker|scripts|_archive)(/|$) {
        deny all;
        return 404;
    }

    # Deny access to deployment and source-control files at the web root
    location ~ ^/(\.gitignore|\.htaccess|docker-compose\.yml|init\.sql|nginx\.conf|claude_code_env\.sh|\.env)$ {
        deny all;
        return 404;
    }

    # Deny access to dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ \.php$ {
        return 404;
    }
}
